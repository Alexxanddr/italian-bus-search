name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - run: npm --version
      - name: Verify package and registry metadata
        run: node -e "const p=require('./package.json'),s=require('./server.json'); if ((process.env.GITHUB_EVENT_NAME==='release' && 'v'+p.version!==process.env.GITHUB_REF_NAME) || s.name!==p.mcpName || s.version!==p.version || s.packages[0].identifier!==p.name || s.packages[0].version!==p.version) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: node scripts/verify-package.mjs
      - name: Install MCP Registry publisher
        run: curl --fail --location --silent --show-error https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - name: Publish to npm if needed
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1 || npm publish --access public
      - name: Wait for npm availability
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in {1..30}; do
            [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 10
          done
          exit 1
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
