name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, personal data, or unredacted provider responses.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe request or test that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release version.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Not provider-specific
        - itabus
        - salemi
        - federico
        - marinobus
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and relevant deployment details.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, cookies, tokens, and personal data.
          required: true
